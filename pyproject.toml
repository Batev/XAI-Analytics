[project]
name = "xai-analytics"
version = "3.0.0.dev0"
description = "Notebook workbench for tabular classifier explanations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.6",
  "matplotlib>=3.9", "imbalanced-learn>=0.13", "xgboost>=2.1",
  "shap>=0.46", "eli5>=0.14", "lime==0.2.0.1", "lime-stability==0.1.1",
  "statsmodels>=0.14", "multipledispatch>=1", "rbo>=0.1.3", "httplib2>=0.22",
  "ipython>=8", "ipywidgets>=8",
]

[dependency-groups]
notebook = ["notebook>=7", "ipykernel>=6"]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-socket>=0.7",
    "ruff>=0.11",
    "nbclient>=0.10",
    "nbformat>=5",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --cov=util --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml"
xfail_strict = true

[tool.ruff]
include = ["util/**/*.py", "tests/**/*.py", ".github/scripts/**/*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
