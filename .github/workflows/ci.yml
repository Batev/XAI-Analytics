name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv python install 3.12
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv lock --check
      - run: uv sync --locked --group notebook --group dev
      - run: uv pip check
      - run: uv run --no-sync pytest -q
      - name: Check pip export is current
        shell: bash
        run: |
          uv export --locked --no-dev --group notebook --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            coverage.xml
            test-results.xml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
