name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          types = "feat|fix|docs|test|ci|build|refactor|perf|style|chore|revert"
          pattern = rf"(?:{types})(?:\([a-z0-9][a-z0-9._/-]*\))?!?: \S(?:[^\r\n]*\S)?"
          if not re.fullmatch(pattern, title) or title.endswith("."):
              print("::error::Use a Conventional Commit title with a lowercase type and scope, "
                    "a nonempty description, and no trailing full stop. See CONTRIBUTING.md.")
              sys.exit(1)
          print("PR title follows Conventional Commits.")
